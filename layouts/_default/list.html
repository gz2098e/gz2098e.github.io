{{ define "main" }}
{{ partial "breadcrumb.html" . }}

<div class="container">
  <div class="page-header-section">
    <h1>{{ .Title }}</h1>
    {{ with .Params.description }}
    <p class="page-description">{{ . }}</p>
    {{ end }}
  </div>

  <!-- If this section has child pages, list them -->
  {{ if .Pages }}
  <div class="article-list">
    {{ range .Pages }}
    <article class="article-card">
      <h2><a href="{{ .Permalink }}">{{ .Title }}</a></h2>
      <p class="article-desc">{{ .Params.description | default .Summary | truncate 150 }}</p>
      <a href="{{ .Permalink }}" class="read-more">Read more →</a>
    </article>
    {{ end }}
  </div>
  {{ else }}
  <div class="page-body">
    {{ .Content }}
  </div>
  {{ end }}
</div>
{{ end }}
