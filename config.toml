  customerCountries = "80+"

# ==============================================================================
# 标记参数（Hugo Markup 配置）
# ==============================================================================
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "github"
    lineNos = false
