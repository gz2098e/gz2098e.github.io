# ==============================================================================
# GOOUTO.com — Hugo 全站统一配置文件
# 修改以下参数即可全站同步，无需逐页修改
# ==============================================================================

baseURL = "https://goouto.com/"
languageCode = "en-us"
title = "GOOUTO Outdoor & Party Wholesale | Yiwu B2B Supplier"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

# 禁用 Hugo 默认分类系统（使用自定义 content/categories/ 方式）
disableKinds = ["taxonomy", "term", "RSS"]

# 构建输出目录
[build]
  writeStats = true

# 菜单配置（主导航栏）
[menus]
  [[menus.main]]
    name = "Home"
    url = "/"
    weight = 1
  [[menus.main]]
    name = "Products"
    url = "/products/"
    weight = 2
  [[menus.main]]
    name = "Services"
    url = "/services/"
    weight = 3
  [[menus.main]]
    name = "About"
    url = "/about/"
    weight = 4
  [[menus.main]]
    name = "Contact"
    url = "/contact/"
    weight = 5

# Sitemap 配置
[sitemap]
  changefreq = "weekly"
  priority = 0.7
  filename = "sitemap.xml"

# ==============================================================================
# 全站参数 — 公司信息、联系方式（核心统一管理区域）
# ==============================================================================
[params]
  # --- 公司基本信息 ---
  companyName = "GOOUTO Outdoor & Party Wholesale"
  companyShortName = "GOOUTO"
  companyFullName = "GOOUTO (Yiwu Gongbei Trading Co., Ltd.)"
  brandTagline = "B2B Outdoor & Party Supplies Showroom from Yiwu China"
  brandSubtitle = "Direct from Yiwu — Factory Prices, Flexible MOQ"
  brandDescription = "GOOUTO is a B2B wholesale showroom for outdoor gear, sports equipment, outdoor toys, and holiday party supplies from Yiwu China. Factory direct prices, flexible MOQ, global shipping."

  # --- 联系方式 ---
  phone = "+8618006891977"
